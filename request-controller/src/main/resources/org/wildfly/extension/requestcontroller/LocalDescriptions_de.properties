request-controller=Das Anfrage-Controller-Subsystem. Verwendet zur Anfragebegrenzung und zum ordnungsgem\u00E4\u00DFen Herunterfahren.
request-controller.add=F\u00FCgt das Anfrage-Controller-Subsystem hinzu.
request-controller.remove=Entfernt das Anfrage-Controller-Subsystem.
request-controller.max-requests=Maximale Anzahl aller Anfragetypen, die gleichzeitig auf einem Server ausgef\u00FChrt werden k\u00F6nnen. Sobald diese Grenze erreicht ist, werden neue Anfragen abgewiesen.
request-controller.active-requests=Anzahl an Anfragen, die derzeit auf dem Server ausgef\u00FChrt werden.
request-controller.track-individual-endpoints=Falls "true", werden Anfragen auf Endpunktebene nachverfolgt, was das Anhalten einzelner Deployments erm\u00F6glicht.

