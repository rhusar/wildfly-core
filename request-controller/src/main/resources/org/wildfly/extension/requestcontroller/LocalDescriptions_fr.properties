request-controller=Le sous-syst\u00E8me de contr\u00F4le des requ\u00EAtes. Utilis\u00E9 pour la limitation des demandes et l'arr\u00EAt progressif.
request-controller.add=Ajoute le sous-syst\u00E8me de contr\u00F4leur de requ\u00EAte.
request-controller.remove=Supprime le sous-syst\u00E8me de contr\u00F4leur de demande.
request-controller.max-requests=Nombre maximal de demandes, tous types confondus, pouvant \u00EAtre ex\u00E9cut\u00E9es sur un serveur \u00E0 la fois. Une fois cette limite atteinte, toute nouvelle demande sera rejet\u00E9e.
request-controller.active-requests=Nombre de requ\u00EAtes en cours sur le serveur.
request-controller.track-individual-endpoints=Si c'est le cas, les demandes sont suivies au niveau du point final, ce qui permet de suspendre les d\u00E9ploiements individuels.

