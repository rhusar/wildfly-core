installation-manager=Mit der Installationsmanager-Ressource k\u00F6nnen Sie Updates anwenden oder die Serverinstallation auf eine bestimmte Version zur\u00FCcksetzen.
installation-manager.channels=Sammlung von Kan\u00E4len.
installation-manager.channels.channel=Ein Channel stellt eine Quelle f\u00FCr abw\u00E4rtskompatible Releases dar.
installation-manager.channels.channel.name=Der Channel-Name ist eine einzeilige, von Menschen lesbare Beschreibung des Channels.
installation-manager.channels.channel.repository=Mit dem Channel verbundenes Repository.
installation-manager.channels.channel.repositories=Sammlung von Repositorys, die die mit dem Channel verbundenen Repositorys definiert.
installation-manager.channels.channel.repository.id=Erforderliche ID, die den in einem Maven-Cache verwendeten Repository-Namen definiert.
installation-manager.channels.channel.repository.url=Erforderliche URL, die auf ein standardm\u00E4\u00DFiges Maven-Repository verweist.
installation-manager.channels.channel.manifest=Channel-Manifest, das den Inhalt des Channels definiert.
installation-manager.channels.channel.manifest.gav=Koordinaten des Maven-Manifests, die dem Format GroupId:ArtifactId:Version folgen. GroupId und ArtifactId sind obligatorische Werte. Der Wert 'Version' ist optional, wenn Sie die Manifestversion angeben m\u00F6chten (anstatt die neueste Version des Manifests zu verlangen). Wenn diese Version nicht angegeben wird, wird die neueste Version des Manifests auf der Grundlage der Metadaten des Maven-Repositorys ermittelt.
installation-manager.channels.channel.manifest.url=URL, unter der die Manifestdatei zu finden ist.

#General repository descriptions used by several operations
installation-manager.repositories.repository=Repository, das derzeit von dieser Operation verwendet wird.
installation-manager.repositories.repository.id=Erforderliche ID, die den im Maven-Cache verwendeten Repository-Namen definiert.
installation-manager.repositories.repository.url=Erforderliche URL, die auf ein standardm\u00E4\u00DFiges Maven-Repository verweist.

# list updates Operation
installation-manager.list-updates=Liste der Komponenten, f\u00FCr die ein Upgrade durchgef\u00FChrt werden kann.
installation-manager.list-updates.offline=F\u00FChren Sie die Installation nur von folgenden Maven-Repositorys aus: lokal oder Dateisystem.
installation-manager.list-updates.repositories=Entfernte Maven-Repositorys, die die f\u00FCr die Installation des Anwendungsservers erforderlichen Artefakte enthalten. (Mehrere Repositorys werden durch Kommata getrennt.) Diese Repositorys \u00FCberschreiben alle anderen konfigurierten Repositorys in allen Kan\u00E4len nur f\u00FCr diese Operation. G\u00FCltige Werte sind entweder URLs oder ID::URL-Paare.
installation-manager.list-updates.local-cache=Pfad zum lokalen Maven-Repository-Cache. Er setzt das standardm\u00E4\u00DFige Maven-Repository unter ~/.m2/repository au\u00DFer Kraft.
installation-manager.list-updates.no-resolve-local-cache=F\u00FChren Sie die Operation durch, ohne Artefakte aus dem/in den lokalen Maven-Cache aufzul\u00F6sen oder zu installieren.
installation-manager.list-updates.no-resolve-local-cache.deprecated=Verwenden Sie stattdessen 'use-default-local-cache'.
installation-manager.list-updates.use-default-local-cache=Aktivieren Sie das Caching und Aufl\u00F6sen von Artefakten aus dem standardm\u00E4\u00DFigen lokalen Maven-Repository.
installation-manager.list-updates.maven-repo-file=Der Index des Zip-Dateistroms des Maven-Repository, der an die aktuelle Operation angeh\u00E4ngt ist. Die Zip-Datei des Maven-Repository enth\u00E4lt die notwendigen Artefakte, um den Serverkandidaten mit den neuesten verf\u00FCgbaren Updates zu versorgen.
installation-manager.list-updates.maven-repo-files=Die Indizes der Zip-Dateistr\u00F6me des Maven-Repository, die an die aktuelle Operation angeh\u00E4ngt sind. Die Zip-Datei des Maven-Repository enth\u00E4lt die notwendigen Artefakte, um den Serverkandidaten mit den neuesten verf\u00FCgbaren Updates zu versorgen.

# Prepare updates Operation
installation-manager.prepare-updates=Stellt einen Serverkandidaten mit den neuesten verf\u00FCgbaren Patches bereit.
installation-manager.prepare-updates.offline=F\u00FChren Sie die Installation nur von folgenden Maven-Repositorys aus: lokal oder Dateisystem.
installation-manager.prepare-updates.repositories=Entfernte Maven-Repositorys, die die f\u00FCr die Installation des Anwendungsservers erforderlichen Artefakte enthalten. Geben Sie mehrere Repositorys durch Kommata getrennt an. Diese Repositorys \u00FCberschreiben alle anderen konfigurierten Repositorys in allen Kan\u00E4len nur f\u00FCr diese Operation. G\u00FCltige Werte sind entweder URLs oder ID::URL-Paare.
installation-manager.prepare-updates.local-cache=Pfad zum lokalen Maven-Repository-Cache. Er setzt das standardm\u00E4\u00DFige Maven-Repository unter ~/.m2/repository au\u00DFer Kraft.
installation-manager.prepare-updates.no-resolve-local-cache=F\u00FChren Sie die Operation durch, ohne Artefakte aus dem/in den lokalen Maven-Cache aufzul\u00F6sen oder zu installieren.
installation-manager.prepare-updates.no-resolve-local-cache.deprecated=Verwenden Sie stattdessen 'use-default-local-cache'.
installation-manager.prepare-updates.use-default-local-cache=Aktivieren Sie das Caching und Aufl\u00F6sen von Artefakten aus dem standardm\u00E4\u00DFigen lokalen Maven-Repository.
installation-manager.prepare-updates.maven-repo-file=Der Index des Zip-Dateistroms des Maven-Repository, der an die aktuelle Operation angeh\u00E4ngt ist. Die Zip-Datei des Maven-Repository enth\u00E4lt die notwendigen Artefakte, um den Serverkandidaten mit den neuesten verf\u00FCgbaren Updates zu versorgen.
installation-manager.prepare-updates.maven-repo-files=Die Indizes der Zip-Dateistr\u00F6me des Maven-Repository, die an die aktuelle Operation angeh\u00E4ngt sind. Die Zip-Datei des Maven-Repository enth\u00E4lt die notwendigen Artefakte, um den Serverkandidaten mit den neuesten verf\u00FCgbaren Updates zu versorgen.
installation-manager.prepare-updates.work-dir=Verzeichnisname relativ zum Dateisystem des Zielservers, der das Maven-Repository enth\u00E4lt, das einen Serverkandidaten mit den zuletzt verf\u00FCgbaren Updates versorgt.

# Revert Operation
installation-manager.prepare-revert=Bereitet einen Serverkandidaten vor, der auf einen fr\u00FCheren Installationszustand zur\u00FCckgesetzt wird.
installation-manager.prepare-revert.revision=Hash eines Installationsstatus.
installation-manager.prepare-revert.offline=F\u00FChren Sie die Installation nur von folgenden Maven-Repositorys aus: lokal oder Dateisystem.
installation-manager.prepare-revert.repositories=Entfernte Maven-Repositorys, die die f\u00FCr die Installation des Anwendungsservers erforderlichen Artefakte enthalten. (Mehrere Repositorys werden durch Kommata getrennt.) Diese Repositorys \u00FCberschreiben alle anderen konfigurierten Repositorys in allen Kan\u00E4len nur f\u00FCr diese Operation. G\u00FCltige Werte sind entweder URLs oder ID::URL-Paare.
installation-manager.prepare-revert.local-cache=Pfad zum lokalen Maven-Repository-Cache. Er setzt das standardm\u00E4\u00DFige Maven-Repository unter ~/.m2/repository au\u00DFer Kraft.
installation-manager.prepare-revert.no-resolve-local-cache=F\u00FChren Sie die Operation durch, ohne Artefakte aus dem/in den lokalen Maven-Cache aufzul\u00F6sen oder zu installieren.
installation-manager.prepare-revert.no-resolve-local-cache.deprecated=Verwenden Sie stattdessen 'use-default-local-cache'.
installation-manager.prepare-revert.use-default-local-cache=Aktivieren Sie das Caching und Aufl\u00F6sen von Artefakten aus dem standardm\u00E4\u00DFigen lokalen Maven-Repository.
installation-manager.prepare-revert.maven-repo-file=Der Index des Zip-Dateistroms des Maven-Repository, der an die aktuelle Operation angeh\u00E4ngt ist. Die Zip-Datei des Maven-Repository enth\u00E4lt die notwendigen Artefakte, um den Serverkandidaten mit den neuesten verf\u00FCgbaren Updates zu versorgen.
installation-manager.prepare-revert.maven-repo-files=Die Indizes der Zip-Dateistr\u00F6me des Maven-Repository, die an die aktuelle Operation angeh\u00E4ngt sind. Die Zip-Datei des Maven-Repository enth\u00E4lt die notwendigen Artefakte, um den Serverkandidaten mit den neuesten verf\u00FCgbaren Updates zu versorgen.

# clean Operation
installation-manager.clean=Bereinigen Sie den Inhalt des Installationsmanagers. Wenn keine Optionen angegeben werden, werden bei der Ausf\u00FChrung dieser Operation alle vorhandenen Serverkandidaten zusammen mit dem zugeh\u00F6rigen Inhalt gel\u00F6scht.
installation-manager.clean.work-dir=L\u00F6scht ein bestimmtes Arbeitsverzeichnis des Installationsmanagers.

# Clone Export
installation-manager.clone-export=Exportieren Sie die Installationsmetadaten.

# History Operation
installation-manager.history=Zeigt die Historie der Installationen an.

# History from revision Operation
installation-manager.history-from-revision=Zeigt die Historie der Installationen ab einer bestimmten Revision an.
installation-manager.history-from-revision.revision=Hash eines Installationsstatus.

# Delete Operation
installation-manager.channel-remove=Heben Sie das Abonnement einer Installation f\u00FCr einen Channel auf.
installation-manager.channel-remove.name=Name des zu entfernenden Channels.

# Upload Custom Patch
installation-manager.custom-patch.upload-custom-patch=L\u00E4dt einen benutzerdefinierten Patch auf den Server hoch. abonniert au\u00DFerdem die aktuelle Installation f\u00FCr einen neuen Channel.
installation-manager.custom-patch.upload-custom-patch.manifest=Maven-Koordinaten des Channel-Manifests, die mit dem benutzerdefinierten Patch verbunden sind. Das erwartete Format ist Maven GA (GroupId:ArtifactId).
installation-manager.custom-patch.upload-custom-patch.custom-patch-file=Benutzerdefinierte Patch-Datei.

# Remove Custom Patch
installation-manager.custom-patch.remove-custom-patch=Entfernt einen benutzerdefinierten Patch vom Basisserver. Au\u00DFerdem wird der Channel, der diesen benutzerdefinierten Patch bereitstellt, entfernt und das Abonnement der Installation f\u00FCr diesen Channel aufgehoben.
installation-manager.custom-patch.remove-custom-patch.manifest=Maven-Koordinaten des Channel-Manifests, die mit dem benutzerdefinierten Patch verbunden sind. Das erwartete Format ist Maven GA (GroupId:ArtifactId).


