installation-manager=El recurso Administrador de instalaci\u00F3n le permite aplicar actualizaciones o revertir la instalaci\u00F3n del servidor a una revisi\u00F3n espec\u00EDfica.
installation-manager.channels=Una colecci\u00F3n de canales.
installation-manager.channels.channel=Un canal representa una fuente de versiones compatibles con versiones anteriores.
installation-manager.channels.channel.name=El nombre del canal es una descripci\u00F3n legible de una l\u00EDnea del canal.
installation-manager.channels.channel.repository=Un repositorio asociado con el canal.
installation-manager.channels.channel.repositories=Una colecci\u00F3n de repositorios que define los repositorios asociados con el canal.
installation-manager.channels.channel.repository.id=Una identificaci\u00F3n obligatoria que define el nombre del repositorio utilizado en una cach\u00E9 de Maven.
installation-manager.channels.channel.repository.url=Una URL obligatoria que apunta a un repositorio de Maven predeterminado.
installation-manager.channels.channel.manifest=El manifiesto de canal que define el contenido del canal.
installation-manager.channels.channel.manifest.gav=Las coordenadas del manifiesto de Maven que siguen el formato GroupId:ArtifactId:Version. GroupId y ArtifactId son valores obligatorios. El valor Version es opcional si desea especificar la versi\u00F3n del manifiesto (en lugar de requerir la \u00FAltima versi\u00F3n). Si no se dispone de esta versi\u00F3n, se determinar\u00E1 la \u00FAltima versi\u00F3n del manifiesto seg\u00FAn los metadatos del repositorio de Maven.
installation-manager.channels.channel.manifest.url=URL donde se puede encontrar el archivo de manifiesto.

#General repository descriptions used by several operations
installation-manager.repositories.repository=El repositorio que actualmente est\u00E1 usando esta operaci\u00F3n.
installation-manager.repositories.repository.id=Una identificaci\u00F3n obligatoria que define el nombre del repositorio utilizado en la cach\u00E9 de Maven.
installation-manager.repositories.repository.url=Una URL obligatoria que apunta a un repositorio de Maven predeterminado.

# list updates Operation
installation-manager.list-updates=Enumere los componentes que se pueden actualizar.
installation-manager.list-updates.offline=Realice la instalaci\u00F3n \u00FAnicamente desde repositorios Maven del sistema de archivos o locales.
installation-manager.list-updates.repositories=Repositorios remotos de Maven que contienen los artefactos necesarios para instalar el servidor de aplicaciones (varios repositorios separados por coma). Estos repositorios anulan cualquier otro repositorio configurado en todos los canales para esta operaci\u00F3n. Los valores v\u00E1lidos son URL o pares ID::URL.
installation-manager.list-updates.local-cache=Ruta a la cach\u00E9 del repositorio local de Maven. Anula el repositorio predeterminado de Maven en ~/.m2/repository.
installation-manager.list-updates.no-resolve-local-cache=Realice la operaci\u00F3n sin resolver ni instalar artefactos desde o en la cach\u00E9 de Maven local.
installation-manager.list-updates.no-resolve-local-cache.deprecated=En su lugar, utilice use-default-local-cache.
installation-manager.list-updates.use-default-local-cache=Habilite el almacenamiento en cach\u00E9 y la resoluci\u00F3n de artefactos desde el repositorio de Maven local predeterminada.
installation-manager.list-updates.maven-repo-file=El \u00EDndice del flujo del archivos zip del repositorio de Maven asociado a la operaci\u00F3n actual. El archivo zip del repositorio de Maven contiene los artefactos necesarios para proporcionar al servidor candidato las actualizaciones m\u00E1s recientes.
installation-manager.list-updates.maven-repo-files=Los \u00EDndices de flujos de archivos zip del repositorio de Maven asociados a la operaci\u00F3n actual. El archivo zip del repositorio de Maven contiene los artefactos necesarios para proporcionar al servidor candidato las actualizaciones m\u00E1s recientes.

# Prepare updates Operation
installation-manager.prepare-updates=Proporciona a un servidor candidato los \u00FAltimos parches disponibles.
installation-manager.prepare-updates.offline=Realice la instalaci\u00F3n \u00FAnicamente desde repositorios Maven del sistema de archivos o locales.
installation-manager.prepare-updates.repositories=Repositorios remotos de Maven que contienen los artefactos necesarios para instalar el servidor de aplicaciones. Especifique varios repositorios separados por coma. Estos repositorios anulan cualquier otro repositorio configurado en todos los canales para esta operaci\u00F3n. Los valores v\u00E1lidos son URL o pares ID::URL.
installation-manager.prepare-updates.local-cache=Ruta a la cach\u00E9 del repositorio local de Maven. Anula el repositorio predeterminado de Maven en ~/.m2/repository.
installation-manager.prepare-updates.no-resolve-local-cache=Realice la operaci\u00F3n sin resolver ni instalar artefactos desde o en la cach\u00E9 de Maven local.
installation-manager.prepare-updates.no-resolve-local-cache.deprecated=En su lugar, utilice use-default-local-cache.
installation-manager.prepare-updates.use-default-local-cache=Habilite el almacenamiento en cach\u00E9 y la resoluci\u00F3n de artefactos desde el repositorio de Maven local predeterminada.
installation-manager.prepare-updates.maven-repo-file=El \u00EDndice del flujo del archivos zip del repositorio de Maven asociado a la operaci\u00F3n actual. El archivo zip del repositorio de Maven contiene los artefactos necesarios para proporcionar al servidor candidato las actualizaciones m\u00E1s recientes.
installation-manager.prepare-updates.maven-repo-files=Los \u00EDndices de flujos de archivos zip del repositorio de Maven asociados a la operaci\u00F3n actual. El archivo zip del repositorio de Maven contiene los artefactos necesarios para proporcionar al servidor candidato las actualizaciones m\u00E1s recientes.
installation-manager.prepare-updates.work-dir=Nombre del directorio relativo al sistema de archivos del servidor de destino, el cual contiene el repositorio de Maven que proporciona a un servidor candidato las actualizaciones m\u00E1s recientes disponibles.

# Revert Operation
installation-manager.prepare-revert=Prepara un servidor candidato revertido a un estado de instalaci\u00F3n anterior.
installation-manager.prepare-revert.revision=Hash de un estado de instalaci\u00F3n.
installation-manager.prepare-revert.offline=Realice la instalaci\u00F3n \u00FAnicamente desde repositorios Maven del sistema de archivos o locales.
installation-manager.prepare-revert.repositories=Repositorios remotos de Maven que contienen los artefactos necesarios para instalar el servidor de aplicaciones (varios repositorios separados por coma). Estos repositorios anulan cualquier otro repositorio configurado en todos los canales para esta operaci\u00F3n. Los valores v\u00E1lidos son URL o pares ID::URL.
installation-manager.prepare-revert.local-cache=Ruta a la cach\u00E9 del repositorio local de Maven. Anula el repositorio predeterminado de Maven en ~/.m2/repository.
installation-manager.prepare-revert.no-resolve-local-cache=Realice la operaci\u00F3n sin resolver ni instalar artefactos desde o en la cach\u00E9 de Maven local.
installation-manager.prepare-revert.no-resolve-local-cache.deprecated=En su lugar, utilice use-default-local-cache.
installation-manager.prepare-revert.use-default-local-cache=Habilite el almacenamiento en cach\u00E9 y la resoluci\u00F3n de artefactos desde el repositorio de Maven local predeterminada.
installation-manager.prepare-revert.maven-repo-file=El \u00EDndice del flujo del archivos zip del repositorio de Maven asociado a la operaci\u00F3n actual. El archivo zip del repositorio de Maven contiene los artefactos necesarios para proporcionar al servidor candidato las actualizaciones m\u00E1s recientes.
installation-manager.prepare-revert.maven-repo-files=Los \u00EDndices de flujos de archivos zip del repositorio de Maven asociados a la operaci\u00F3n actual. El archivo zip del repositorio de Maven contiene los artefactos necesarios para proporcionar al servidor candidato las actualizaciones m\u00E1s recientes.

# clean Operation
installation-manager.clean=Limpiar el contenido del administrador de instalaci\u00F3n. Si no se brindan opciones, al ejecutar esta operaci\u00F3n se eliminar\u00E1 cualquier candidato a servidor existente junto con su contenido asociado.
installation-manager.clean.work-dir=Elimina un directorio de trabajo del administrador de instalaci\u00F3n espec\u00EDfico.

# Clone Export
installation-manager.clone-export=Exportar los metadatos de la instalaci\u00F3n.

# History Operation
installation-manager.history=Muestra el historial de instalaciones.

# History from revision Operation
installation-manager.history-from-revision=Muestra el historial de instalaciones de una revisi\u00F3n espec\u00EDfica.
installation-manager.history-from-revision.revision=Hash de un estado de instalaci\u00F3n.

# Delete Operation
installation-manager.channel-remove=Cancela la suscripci\u00F3n a una instalaci\u00F3n de un canal.
installation-manager.channel-remove.name=Nombre del canal que desea eliminar.

# Upload Custom Patch
installation-manager.custom-patch.upload-custom-patch=Carga un parche personalizado al servidor. Tambi\u00E9n suscribe la instalaci\u00F3n actual a un nuevo canal.
installation-manager.custom-patch.upload-custom-patch.manifest=Coordenadas Maven del manifiesto del canal asociadas con el parche personalizado. El formato esperado es Maven GA (GroupId:ArtifactId).
installation-manager.custom-patch.upload-custom-patch.custom-patch-file=Un archivo de parche personalizado.

# Remove Custom Patch
installation-manager.custom-patch.remove-custom-patch=Elimina un parche personalizado del servidor base. Tambi\u00E9n elimina el canal que lo proporciona y cancela la suscripci\u00F3n a la instalaci\u00F3n de dicho canal.
installation-manager.custom-patch.remove-custom-patch.manifest=Coordenadas Maven del manifiesto del canal asociadas con el parche personalizado. El formato esperado es Maven GA (GroupId:ArtifactId).


