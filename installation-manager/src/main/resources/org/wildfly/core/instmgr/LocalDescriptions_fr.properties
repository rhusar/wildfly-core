installation-manager=La ressource Gestionnaire d'installation vous permet d'appliquer des mises \u00E0 jour ou de revenir \u00E0 une r\u00E9vision sp\u00E9cifique de l'installation du serveur.
installation-manager.channels=Une collection de canaux.
installation-manager.channels.channel=Un canal repr\u00E9sente une source de versions r\u00E9trocompatibles.
installation-manager.channels.channel.name=Le nom du canal est une description d'une ligne lisible par l'homme du canal.
installation-manager.channels.channel.repository=Un r\u00E9f\u00E9rentiel associ\u00E9 au canal.
installation-manager.channels.channel.repositories=Une collection de r\u00E9f\u00E9rentiels qui d\u00E9finit les r\u00E9f\u00E9rentiels associ\u00E9s au canal.
installation-manager.channels.channel.repository.id=Un identifiant obligatoire qui d\u00E9finit le nom du r\u00E9f\u00E9rentiel utilis\u00E9 dans un cache Maven.
installation-manager.channels.channel.repository.url=URL obligatoire pointant vers un r\u00E9f\u00E9rentiel Maven par d\u00E9faut.
installation-manager.channels.channel.manifest=Le manifeste du canal qui d\u00E9finit le contenu du canal.
installation-manager.channels.channel.manifest.gav=Les coordonn\u00E9es du manifeste Maven qui suivent le format GroupId:ArtifactId:Version. GroupId et ArtifactId sont des valeurs obligatoires. La valeur Version est facultative si vous souhaitez sp\u00E9cifier la version du manifeste (au lieu de demander la derni\u00E8re version de ce manifeste). En l'absence de cette version, la derni\u00E8re version du manifeste sera d\u00E9termin\u00E9e sur la base des m\u00E9tadonn\u00E9es du r\u00E9f\u00E9rentiel Maven.
installation-manager.channels.channel.manifest.url=URL o\u00F9 se trouve le fichier manifeste.

#General repository descriptions used by several operations
installation-manager.repositories.repository=Le r\u00E9f\u00E9rentiel actuellement utilis\u00E9 par cette op\u00E9ration.
installation-manager.repositories.repository.id=Un identifiant obligatoire qui d\u00E9finit le nom du r\u00E9f\u00E9rentiel utilis\u00E9 dans le cache Maven.
installation-manager.repositories.repository.url=URL obligatoire pointant vers un r\u00E9f\u00E9rentiel Maven par d\u00E9faut.

# list updates Operation
installation-manager.list-updates=Dressez la liste des composants qui peuvent \u00EAtre mis \u00E0 niveau.
installation-manager.list-updates.offline=L'installation ne peut se faire qu'\u00E0 partir de r\u00E9f\u00E9rentiels Maven locaux ou de syst\u00E8mes de fichiers.
installation-manager.list-updates.repositories=R\u00E9f\u00E9rentiels Maven distants contenant les artefacts n\u00E9cessaires \u00E0 l'installation du serveur d'application (plusieurs r\u00E9f\u00E9rentiels sont s\u00E9par\u00E9s par des virgules). Ces r\u00E9f\u00E9rentiels remplaceront tous les autres r\u00E9f\u00E9rentiels configur\u00E9s dans tous les canaux pour cette op\u00E9ration uniquement. Les valeurs valides sont des URL ou des paires ID::URL.
installation-manager.list-updates.local-cache=Chemin d'acc\u00E8s au cache du r\u00E9f\u00E9rentiel Maven local. Il remplace le r\u00E9f\u00E9rentiel Maven par d\u00E9faut qui se trouve \u00E0 ~/.m2/repository.
installation-manager.list-updates.no-resolve-local-cache=Effectuer l'op\u00E9ration sans r\u00E9soudre ou installer les artefacts depuis/vers le cache Maven local.
installation-manager.list-updates.no-resolve-local-cache.deprecated=Utilisez plut\u00F4t use-default-local-cache.
installation-manager.list-updates.use-default-local-cache=Activez la mise en cache et la r\u00E9solution des artefacts \u00E0 partir du r\u00E9f\u00E9rentiel Maven local par d\u00E9faut.
installation-manager.list-updates.maven-repo-file=L'index du flux du fichier Zip du r\u00E9f\u00E9rentiel Maven attach\u00E9 \u00E0 l'op\u00E9ration en cours. Le fichier Zip du r\u00E9f\u00E9rentiel Maven contient les artefacts n\u00E9cessaires pour fournir au candidat serveur les derni\u00E8res mises \u00E0 jour disponibles.
installation-manager.list-updates.maven-repo-files=Les index des flux du fichier Zip du r\u00E9f\u00E9rentiel Maven sont attach\u00E9s \u00E0 l'op\u00E9ration en cours. Le fichier Zip du r\u00E9f\u00E9rentiel Maven contient les artefacts n\u00E9cessaires pour fournir au candidat serveur les derni\u00E8res mises \u00E0 jour disponibles.

# Prepare updates Operation
installation-manager.prepare-updates=Fournit un serveur candidat avec les derniers correctifs disponibles.
installation-manager.prepare-updates.offline=L'installation ne peut se faire qu'\u00E0 partir de r\u00E9f\u00E9rentiels Maven locaux ou de syst\u00E8mes de fichiers.
installation-manager.prepare-updates.repositories=R\u00E9f\u00E9rentiels Maven distants contenant les artefacts n\u00E9cessaires \u00E0 l'installation du serveur d'application. Sp\u00E9cifiez plusieurs r\u00E9f\u00E9rentiels s\u00E9par\u00E9s par des virgules. Ces r\u00E9f\u00E9rentiels remplaceront tous les autres r\u00E9f\u00E9rentiels configur\u00E9s dans tous les canaux pour cette op\u00E9ration uniquement. Les valeurs valides sont des URL ou des paires ID::URL.
