# clean Operation
installation-manager.clean=Nettoyer le contenu du gestionnaire d'installation. Si aucune option n'est fournie, l'ex\u00E9cution de cette op\u00E9ration supprimera tout candidat serveur existant ainsi que son contenu associ\u00E9.
installation-manager.clean.work-dir=Supprime un r\u00E9pertoire de travail sp\u00E9cifique du gestionnaire d'installation.

# Clone Export
installation-manager.clone-export=Exporter les m\u00E9tadonn\u00E9es d'installation.

# History Operation
installation-manager.history=Affiche l'historique des installations.

# History from revision Operation
installation-manager.history-from-revision=Affiche l'historique des installations \u00E0 partir d'une r\u00E9vision sp\u00E9cifique.
installation-manager.history-from-revision.revision=Hachage d'un \u00E9tat d'installation.

# Delete Operation
installation-manager.channel-remove=D\u00E9sinscrire une installation d'un canal.
installation-manager.channel-remove.name=Nom du canal \u00E0 supprimer.

# Upload Custom Patch
installation-manager.custom-patch.upload-custom-patch=Charge un correctif personnalis\u00E9 sur le serveur. Il abonne \u00E9galement l'installation actuelle \u00E0 un nouveau canal.
installation-manager.custom-patch.upload-custom-patch.manifest=Coordonn\u00E9es du manifeste Maven associ\u00E9 au correctif personnalis\u00E9. Le format attendu est Maven GA (GroupId:ArtifactId).
installation-manager.custom-patch.upload-custom-patch.custom-patch-file=Un fichier correctif personnalis\u00E9.

# Remove Custom Patch
installation-manager.custom-patch.remove-custom-patch=Supprime un correctif personnalis\u00E9 du serveur de base. Il supprime \u00E9galement le canal qui fournit ce correctif personnalis\u00E9 et d\u00E9sabonne l'installation de ce canal.
installation-manager.custom-patch.remove-custom-patch.manifest=Coordonn\u00E9es du manifeste Maven associ\u00E9 au correctif personnalis\u00E9. Le format attendu est Maven GA (GroupId:ArtifactId).


