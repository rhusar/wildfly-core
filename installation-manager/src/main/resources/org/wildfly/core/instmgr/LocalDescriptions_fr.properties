installation-manager.prepare-revert.no-resolve-local-cache=Effectuer l'op\u00E9ration sans r\u00E9soudre ou installer les artefacts depuis/vers le cache Maven local.
installation-manager.prepare-revert.no-resolve-local-cache.deprecated=Utilisez plut\u00F4t use-default-local-cache.
installation-manager.prepare-revert.use-default-local-cache=Activez la mise en cache et la r\u00E9solution des artefacts \u00E0 partir du r\u00E9f\u00E9rentiel Maven local par d\u00E9faut.
installation-manager.prepare-revert.maven-repo-file=L'index du flux du fichier Zip du r\u00E9f\u00E9rentiel Maven attach\u00E9 \u00E0 l'op\u00E9ration en cours. Le fichier Zip du r\u00E9f\u00E9rentiel Maven contient les artefacts n\u00E9cessaires pour fournir au candidat serveur les derni\u00E8res mises \u00E0 jour disponibles.
