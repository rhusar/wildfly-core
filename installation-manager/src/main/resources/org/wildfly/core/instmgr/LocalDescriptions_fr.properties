installation-manager.prepare-updates.no-resolve-local-cache=Effectuer l'op\u00E9ration sans r\u00E9soudre ou installer les artefacts depuis/vers le cache Maven local.
installation-manager.prepare-updates.no-resolve-local-cache.deprecated=Utilisez plut\u00F4t use-default-local-cache.
installation-manager.prepare-updates.use-default-local-cache=Activez la mise en cache et la r\u00E9solution des artefacts \u00E0 partir du r\u00E9f\u00E9rentiel Maven local par d\u00E9faut.
installation-manager.prepare-updates.maven-repo-file=L'index du flux du fichier Zip du r\u00E9f\u00E9rentiel Maven attach\u00E9 \u00E0 l'op\u00E9ration en cours. Le fichier Zip du r\u00E9f\u00E9rentiel Maven contient les artefacts n\u00E9cessaires pour fournir au candidat serveur les derni\u00E8res mises \u00E0 jour disponibles.
installation-manager.prepare-updates.maven-repo-files=Les index des flux du fichier Zip du r\u00E9f\u00E9rentiel Maven sont attach\u00E9s \u00E0 l'op\u00E9ration en cours. Le fichier Zip du r\u00E9f\u00E9rentiel Maven contient les artefacts n\u00E9cessaires pour fournir au candidat serveur les derni\u00E8res mises \u00E0 jour disponibles.
installation-manager.prepare-updates.work-dir=Nom du r\u00E9pertoire relatif au syst\u00E8me de fichiers du serveur cible, qui contient le r\u00E9f\u00E9rentiel Maven qui fournit \u00E0 un candidat serveur les derni\u00E8res mises \u00E0 jour disponibles.

# Revert Operation
installation-manager.prepare-revert=Pr\u00E9pare un candidat serveur \u00E0 revenir \u00E0 un \u00E9tat d'installation ant\u00E9rieur.
installation-manager.prepare-revert.revision=Hachage d'un \u00E9tat d'installation.
