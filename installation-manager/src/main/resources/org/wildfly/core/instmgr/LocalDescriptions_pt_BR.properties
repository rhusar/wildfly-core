installation-manager=O recurso Installation Manager permite que voc\u00EA aplique atualiza\u00E7\u00F5es ou reverta a instala\u00E7\u00E3o do servidor para uma revis\u00E3o espec\u00EDfica.
installation-manager.channels=Uma cole\u00E7\u00E3o de canais.
installation-manager.channels.channel=Um canal representa uma fonte de vers\u00F5es compat\u00EDveis com vers\u00F5es anteriores.
installation-manager.channels.channel.name=O nome do canal \u00E9 uma descri\u00E7\u00E3o de uma linha leg\u00EDvel por humanos do canal.
installation-manager.channels.channel.repository=Um reposit\u00F3rio associado ao canal.
installation-manager.channels.channel.repositories=Uma cole\u00E7\u00E3o de reposit\u00F3rios que define os reposit\u00F3rios associados ao canal.
installation-manager.channels.channel.repository.id=Uma ID obrigat\u00F3ria que define o nome do reposit\u00F3rio usado em um cache do Maven.
installation-manager.channels.channel.repository.url=Uma URL obrigat\u00F3ria que aponta para um reposit\u00F3rio Maven padr\u00E3o.
installation-manager.channels.channel.manifest=O Manifesto do canal que define o conte\u00FAdo do canal.
installation-manager.channels.channel.manifest.gav=As coordenadas do manifesto Maven que seguem o formato GroupId:ArtifactId:Version. GroupId e ArtifactId s\u00E3o valores obrigat\u00F3rios. O valor Version \u00E9 opcional, se voc\u00EA quiser especificar a vers\u00E3o do manifesto (em vez de exigir a vers\u00E3o mais recente desse manifesto). Na aus\u00EAncia dessa vers\u00E3o, a vers\u00E3o mais recente do manifesto ser\u00E1 determinada com base nos metadados do reposit\u00F3rio Maven.
installation-manager.channels.channel.manifest.url=URL em que o arquivo de manifesto pode ser encontrado.

#General repository descriptions used by several operations
installation-manager.repositories.repository=O reposit\u00F3rio atualmente em uso por essa opera\u00E7\u00E3o.
installation-manager.repositories.repository.id=Uma ID obrigat\u00F3ria que define o nome do reposit\u00F3rio usado no cache do Maven.
installation-manager.repositories.repository.url=Uma URL obrigat\u00F3ria que aponta para um reposit\u00F3rio Maven padr\u00E3o.

# list updates Operation
installation-manager.list-updates=Liste os componentes que podem ser atualizados.
installation-manager.list-updates.offline=Realize a instala\u00E7\u00E3o apenas a partir do local ou dos reposit\u00F3rios Maven do sistema de arquivos.
installation-manager.list-updates.repositories=Reposit\u00F3rios Maven remotos que cont\u00EAm os artefatos necess\u00E1rios para instalar o servidor do aplicativo (v\u00E1rios reposit\u00F3rios separados por v\u00EDrgulas). Esses reposit\u00F3rios substituir\u00E3o outros reposit\u00F3rios configurados em todos os canais apenas para esta opera\u00E7\u00E3o. Os valores v\u00E1lidos s\u00E3o URLs ou pares ID::URL.
installation-manager.list-updates.local-cache=Caminho para o cache do reposit\u00F3rio Maven local. Ele substitui o reposit\u00F3rio Maven padr\u00E3o em ~/.m2/repository.
installation-manager.list-updates.no-resolve-local-cache=Execute a opera\u00E7\u00E3o sem resolver ou instalar artefatos do/no cache local do maven.
installation-manager.list-updates.no-resolve-local-cache.deprecated=Em vez disso, use use-default-local-cache.
installation-manager.list-updates.use-default-local-cache=Habilite o armazenamento em cache e a resolu\u00E7\u00E3o de artefatos do reposit\u00F3rio Maven local padr\u00E3o.
installation-manager.list-updates.maven-repo-file=O \u00EDndice do fluxo do arquivo Zip do Reposit\u00F3rio Maven anexado \u00E0 opera\u00E7\u00E3o atual. O arquivo Zip do Reposit\u00F3rio Maven cont\u00E9m os artefatos necess\u00E1rios para fornecer ao candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.
installation-manager.list-updates.maven-repo-files=Os \u00EDndices do fluxo do arquivo Zip do Reposit\u00F3rio Maven anexados \u00E0 opera\u00E7\u00E3o atual. O arquivo Zip do Reposit\u00F3rio Maven cont\u00E9m os artefatos necess\u00E1rios para fornecer ao candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.

# Prepare updates Operation
installation-manager.prepare-updates=Disponibiliza um candidato a servidor com os patches mais recentes dispon\u00EDveis.
installation-manager.prepare-updates.offline=Realize a instala\u00E7\u00E3o apenas a partir do local ou dos reposit\u00F3rios Maven do sistema de arquivos.
installation-manager.prepare-updates.repositories=Reposit\u00F3rios Maven remotos que cont\u00EAm os artefatos necess\u00E1rios para instalar o servidor do aplicativo. Especifique v\u00E1rios reposit\u00F3rios separados por v\u00EDrgulas. Esses reposit\u00F3rios substituir\u00E3o outros reposit\u00F3rios configurados em todos os canais apenas para esta opera\u00E7\u00E3o. Os valores v\u00E1lidos s\u00E3o URLs ou pares ID::URL.
installation-manager.prepare-updates.local-cache=Caminho para o cache do reposit\u00F3rio Maven local. Ele substitui o reposit\u00F3rio Maven padr\u00E3o em ~/.m2/repository.
installation-manager.prepare-updates.no-resolve-local-cache=Execute a opera\u00E7\u00E3o sem resolver ou instalar artefatos do/no cache local do maven.
installation-manager.prepare-updates.no-resolve-local-cache.deprecated=Em vez disso, use use-default-local-cache.
installation-manager.prepare-updates.use-default-local-cache=Habilite o armazenamento em cache e a resolu\u00E7\u00E3o de artefatos do reposit\u00F3rio Maven local padr\u00E3o.
installation-manager.prepare-updates.maven-repo-file=O \u00EDndice do fluxo do arquivo Zip do Reposit\u00F3rio Maven anexado \u00E0 opera\u00E7\u00E3o atual. O arquivo Zip do Reposit\u00F3rio Maven cont\u00E9m os artefatos necess\u00E1rios para fornecer ao candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.
installation-manager.prepare-updates.maven-repo-files=Os \u00EDndices do fluxo do arquivo Zip do Reposit\u00F3rio Maven anexados \u00E0 opera\u00E7\u00E3o atual. O arquivo Zip do Reposit\u00F3rio Maven cont\u00E9m os artefatos necess\u00E1rios para fornecer ao candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.
installation-manager.prepare-updates.work-dir=Nome do diret\u00F3rio relativo ao sistema de arquivos do servidor de destino, que cont\u00E9m o reposit\u00F3rio Maven que fornece a um candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.

# Revert Operation
installation-manager.prepare-revert=Prepara um candidato servidor revertido para um estado de instala\u00E7\u00E3o anterior.
installation-manager.prepare-revert.revision=Hash de um estado de instala\u00E7\u00E3o.
installation-manager.prepare-revert.offline=Realize a instala\u00E7\u00E3o apenas a partir do local ou dos reposit\u00F3rios Maven do sistema de arquivos.
installation-manager.prepare-revert.repositories=Reposit\u00F3rios Maven remotos que cont\u00EAm os artefatos necess\u00E1rios para instalar o servidor do aplicativo (v\u00E1rios reposit\u00F3rios separados por v\u00EDrgulas). Esses reposit\u00F3rios substituir\u00E3o outros reposit\u00F3rios configurados em todos os canais apenas para esta opera\u00E7\u00E3o. Os valores v\u00E1lidos s\u00E3o URLs ou pares ID::URL.
installation-manager.prepare-revert.local-cache=Caminho para o cache do reposit\u00F3rio Maven local. Ele substitui o reposit\u00F3rio Maven padr\u00E3o em ~/.m2/repository.
installation-manager.prepare-revert.no-resolve-local-cache=Execute a opera\u00E7\u00E3o sem resolver ou instalar artefatos do/no cache local do maven.
installation-manager.prepare-revert.no-resolve-local-cache.deprecated=Em vez disso, use use-default-local-cache.
installation-manager.prepare-revert.use-default-local-cache=Habilite o armazenamento em cache e a resolu\u00E7\u00E3o de artefatos do reposit\u00F3rio Maven local padr\u00E3o.
installation-manager.prepare-revert.maven-repo-file=O \u00EDndice do fluxo do arquivo Zip do Reposit\u00F3rio Maven anexado \u00E0 opera\u00E7\u00E3o atual. O arquivo Zip do Reposit\u00F3rio Maven cont\u00E9m os artefatos necess\u00E1rios para fornecer ao candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.
installation-manager.prepare-revert.maven-repo-files=Os \u00EDndices do fluxo do arquivo Zip do Reposit\u00F3rio Maven anexados \u00E0 opera\u00E7\u00E3o atual. O arquivo Zip do Reposit\u00F3rio Maven cont\u00E9m os artefatos necess\u00E1rios para fornecer ao candidato servidor as atualiza\u00E7\u00F5es dispon\u00EDveis mais recentes.

# clean Operation
installation-manager.clean=Limpar o conte\u00FAdo do gerenciador de instala\u00E7\u00E3o. Se nenhuma op\u00E7\u00E3o for fornecida, a execu\u00E7\u00E3o dessa opera\u00E7\u00E3o excluir\u00E1 qualquer candidato servidor existente, juntamente com seu conte\u00FAdo associado.
installation-manager.clean.work-dir=Exclui um diret\u00F3rio de trabalho espec\u00EDfico do gerenciador de instala\u00E7\u00E3o.

# Clone Export
installation-manager.clone-export=Exporta os metadados da instala\u00E7\u00E3o.

# History Operation
installation-manager.history=Mostra o hist\u00F3rico de instala\u00E7\u00F5es.

# History from revision Operation
installation-manager.history-from-revision=Mostra o hist\u00F3rico de instala\u00E7\u00F5es de uma revis\u00E3o espec\u00EDfica.
installation-manager.history-from-revision.revision=Hash de um estado de instala\u00E7\u00E3o.

# Delete Operation
installation-manager.channel-remove=Cancela a inscri\u00E7\u00E3o de uma instala\u00E7\u00E3o em um canal.
installation-manager.channel-remove.name=Nome do canal a ser removido.

# Upload Custom Patch
installation-manager.custom-patch.upload-custom-patch=Carrega um patch personalizado no servidor. Ele tamb\u00E9m inscreve a instala\u00E7\u00E3o atual em um novo canal.
installation-manager.custom-patch.upload-custom-patch.manifest=Coordenadas maven do Manifesto do canal associadas ao patch personalizado. O formato esperado \u00E9 Maven GA (GroupId:ArtifactId).
installation-manager.custom-patch.upload-custom-patch.custom-patch-file=Um arquivo de patch personalizado.

# Remove Custom Patch
installation-manager.custom-patch.remove-custom-patch=Remove um patch personalizado do servidor base. Ele tamb\u00E9m remove o canal que fornece esse patch personalizado e cancela a inscri\u00E7\u00E3o da instala\u00E7\u00E3o nesse canal.
installation-manager.custom-patch.remove-custom-patch.manifest=Coordenadas maven do Manifesto do canal associadas ao patch personalizado. O formato esperado \u00E9 Maven GA (GroupId:ArtifactId).


